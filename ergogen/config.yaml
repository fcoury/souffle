meta:
  engine: 4.1.0
  name: souffle
  version: 0.1
  ref: &kb_ref "Souffle"
  author: "Felipe Coury"
  url: &kb_url https://github.com/fcoury/souffle # Replace with your repo if you create one
  footprint: &switch_footprint "pg1316s_reversible"
  # footprint: &switch_footprint "switch_choc_v1_v2"
  switch:
    $extends: presets.pg1316s
    # $extends: presets.choc_v1

presets:
  pg1316s:
    # Key and keycap measures
    kx: 13.5 # spacing between key centers (X-axis)
    ky: 13 # spacing between key centers (Y-axis)
    ks: 18.5 # horizontal space between columns (default: 19)
    kp: 18.5 # vertical padding between keys (deafult: 19)
    kpx: ks * 0.5 # x padding for the outline
    kpy: kp * 0.5 # y padding for the outline
    kcow: 13.8 # key cutout hole width (cherry, choc v2: 14, choc v1: 13.8)
    kcoh: 13.8 # key cutout hole height (cherry, choc v2: 14, choc v1: 13.8)
    keycw: 17.5 # keycap width (cherry: 18, choc: 17.5)
    keych: 16.5 # keycap height (cherry: 18, choc: 16.5)
    led_pos_x: 0 # Led X position relative to the switch center
    led_pos_y: 4.7 # Led Y position relative to the switch center
    led_rotation: 0 # Led rotation
    vertical_underglow_shift: -kp + 7.8 # How much to shift underglow leds tied to keys
    vertical_diode_shift: 1.5 # How much to shift to avoid overlap
    horizontal_diode_shift: -0.5 kcow - 0.85
    diode_rotation: 0 # Diode rotation
    switch_rotation: 0
    plate_to_pcb_padding: 3
  choc_v1:
    # Key and keycap measures
    kx: cx # spacing between key centers (X-axis)
    ky: cy # spacing between key centers (Y-axis)
    ks: 18.5 # horizontal space between columns (default: 19)
    kp: 17.5 # vertical padding between keys (deafult: 19)
    kpx: ks * 0.5 # x padding for the outline
    kpy: kp * 0.5 # y padding for the outline
    kcow: 13.8 # key cutout hole width (cherry, choc v2: 14, choc v1: 13.8)
    kcoh: 13.8 # key cutout hole height (cherry, choc v2: 14, choc v1: 13.8)
    keycw: 17.5 # keycap width (cherry: 18, choc: 17.5)
    keych: 16.5 # keycap height (cherry: 18, choc: 16.5)
    led_pos_x: 0 # Led X position relative to the switch center
    led_pos_y: 4.7 # Led Y position relative to the switch center
    led_rotation: 0 # Led rotation
    vertical_underglow_shift: -kp + 7.8 # How much to shift underglow leds tied to keys
    vertical_diode_shift: -3.0 # How much to shift to avoid overlap
    horizontal_diode_shift: -0.5 kcow - 0.85
    diode_rotation: -180 # Diode rotation
    switch_rotation: 180 # Hotswap south, led north
    plate_to_pcb_padding: 3
  choc_v2:
    # Key and keycap measures
    $extends: presets.choc_v1
    kx: u # spacing between key centers (X-axis)
    ky: u # spacing between key centers (Y-axis)
    ks: 19 # horizontal space between columns (default: 19)
    kp: 19 # vertical padding between keys (deafult: 19)
    keycw: 18 # keycap width (cherry: 18, choc: 17.5)
    keych: 18 # keycap height (cherry: 18, choc: 16.5)

units:
  # The following statements will make the content of the preset
  # available in the units context
  $extends: meta.switch

  hand_rotation: 0

  outer_splay: 5
  pinky_splay: 2.5

  # Physical measures
  screw_radius: 1.1 # M2 screws
  # screw_radius: 1.6 # M3 screws
  screw_diameter: screw_radius * 2
  screw_head_radius: 2.05
  screw_head_diameter: screw_head_radius * 2
  spacer_radius: 1.725 # M2 standoffs
  spacer_diameter: spacer_radius * 2
  fillet_radius: 0.5
  pwr_trace_width: 0.25
  gnd_trace_width: 0.25
  signal_trace_width: 0.15
  via_size: 0.56 # JLCPCB min 0.56 | KiCad default 0.8
  via_drill: 0.3 # JLCPCB min 0.3 | KiCad default 0.4

  # Case variables
  case_wall_thickness: 1.2
  pcb_to_case_wall_tolerance: 0.25
  bottom_plate_thickness: 1.0
  top_plate_thickness: 1.6
  internal_distance_between_plates: 4

  # xiao nrf52840 dimensions
  mcux: 17.78
  mcuy: 21

  # nice!nano dimensions
  # mcux: 18
  # mcuy: 33.4

  # nice!nano rotated dimensions
  # mcux: 33.4
  # mcuy: 18

  # pcb rectangle dimensions
  pcbx: 119
  pcby: 104

points:
  zones:
    matrix:
      key:
        padding: kp
        spread: ks
        tags:
          - key
      anchor:
        rotate: hand_rotation
        shift: [100, -120] # Fix KiCad placement
        # rotate: pinky_splay + ring_splay
      columns:
        outer:
          key:
            column_net: C0
        pinky:
          key:
            column_net: C1
        ring:
          key:
            stagger: 0.25 kp
            column_net: C2
        middle:
          key:
            stagger: 0.125 kp
            column_net: C3
        index:
          key:
            stagger: -0.125 kp
            column_net: C4
        inner:
          key:
            stagger: -0.125 kp
            column_net: C5
      rows:
        bottom:
          row_net: R3
        home:
          row_net: R2
        top:
          row_net: R1
        number:
          row_net: R0

    thumb:
      key:
        padding: kp
        spread: ks
        stagger: 0
      anchor:
        # cols: outer, pinky, ring, middle, index, inner
        ref: matrix_index_bottom
        shift: [-0.5 kp, -1.1 kp]
      columns:
        inward: # Closest thumb key to the main matrix
          key:
            column_net: C3
        middle: # Extra outward thumb key
          key:
            column_net: C4
            shift: [0, -1]
            splay: -7.5
        outward: # The space/enter key 1.5u
          key:
            column_net: C5
            shift: [0, -2]
            splay: -7.5
      rows:
        home:
          row_net: R4 # New row net for thumb cluster

    ref_mcu:
      anchor:
        ref: matrix_ring_bottom
        shift: [6, -23.1]

    ref_display:
      anchor:
        ref: matrix_index_number
        shift: [13, 20.1]

    screw_pcb_top_left:
      key.tags:
        - helper
        - screw
      anchor:
        ref: ref_mcu
        shift: [0.5 mcux + 5, 5]

    screw_pcb_top_right:
      key.tags:
        - helper
        - screw
      anchor:
        ref: ref_display
        shift: [15, -10]

    screw_pcb_bottom_left:
      key.tags:
        - helper
        - screw
      anchor:
        ref: matrix_outer_bottom
        shift: [-0.5 kp, -0.5 kp - 2]

    screw_pcb_bottom_right:
      key.tags:
        - helper
        - screw
      anchor:
        ref: matrix_inner_bottom
        shift: [0.5 ks + 2, -0.5 kp]

  mirror:
    ref: matrix_inner_number
    distance: 80

outlines:
  left_matrix_outline:
    - what: polygon
      operation: stack
      points:
        # Top Row
        # cols: outer, pinky, ring, middle, index, inner
        # rows: number, top, home, bottom
        - ref: matrix_outer_number # Before the first key on the first row
          shift: [-kpx, kpy]
        - ref: matrix_pinky_number # After the second key on the first row (same y so far)
          shift: [kpx, kpy]
        - ref: matrix_ring_number # Goes up to before the third key
          shift: [-kpx, kpy]
        - ref: matrix_ring_number # Move horizontally to after the third key
          shift: [kpx, kpy]
        - ref: matrix_middle_number # Move down to before the fourth row
          shift: [-kpx, kpy]
        - ref: matrix_middle_number # And right to after it
          shift: [kpx, kpy]
        - ref: matrix_index_number # Now down to the before 5th key
          shift: [-kpx, kpy]
        - ref: matrix_index_number # And right to after it
          shift: [kpx, kpy]
        - ref: matrix_inner_number # Down againt to before the 6th key
          shift: [-kpx, kpy]
        - ref: matrix_inner_number # And also right to after it
          shift: [kpx, kpy]

        # Line from top right down to before the thumb cluster
        - ref: matrix_inner_bottom
          shift: [kpx, -kpy]

        # --- Thumb Cluster Contour ---
        # cols: inward, mid, outward, middle, outward
        # rows: home
        #
        - ref: thumb_outward_home
          shift: [-kpx, kpy]
        - ref: thumb_outward_home
          shift: [kpx, kpy]
        - ref: thumb_outward_home
          shift: [kpx, -kpy]
        - ref: thumb_outward_home
          shift: [-kpx, -kpy]
        - ref: thumb_middle_home
          shift: [kpx, -kpy]
        - ref: thumb_middle_home
          shift: [-kpx, -kpy]
        - ref: thumb_inward_home
          shift: [-kpx, -kpy]

        # Back to the main matrix
        - ref: matrix_outer_bottom
          shift: [-kpx, -kpy]

  right_matrix_outline:
    - what: polygon
      operation: stack
      points:
        # Top Row
        # cols: outer, pinky, ring, middle, index, inner
        # rows: number, top, home, bottom
        - ref: mirror_matrix_outer_number # Before the first key on the first row
          shift: [-kpx, kpy]
        - ref: mirror_matrix_pinky_number # After the second key on the first row (same y so far)
          shift: [kpx, kpy]
        - ref: mirror_matrix_ring_number # Goes up to before the third key
          shift: [-kpx, kpy]
        - ref: mirror_matrix_ring_number # Move horizontally to after the third key
          shift: [kpx, kpy]
        - ref: mirror_matrix_middle_number # Move down to before the fourth row
          shift: [-kpx, kpy]
        - ref: mirror_matrix_middle_number # And right to after it
          shift: [kpx, kpy]
        - ref: mirror_matrix_index_number # Now down to the before 5th key
          shift: [-kpx, kpy]
        - ref: mirror_matrix_index_number # And right to after it
          shift: [kpx, kpy]
        - ref: mirror_matrix_inner_number # Down againt to before the 6th key
          shift: [-kpx, kpy]
        - ref: mirror_matrix_inner_number # And also right to after it
          shift: [kpx, kpy]

        # Line from top right down to before the thumb cluster
        - ref: mirror_matrix_inner_bottom
          shift: [kpx, -kpy]

        # --- Thumb Cluster Contour ---
        # cols: inward, mid, outward, middle, outward
        # rows: home
        #
        - ref: mirror_thumb_outward_home
          shift: [-kpx, kpy]
        - ref: mirror_thumb_outward_home
          shift: [kpx, kpy]
        - ref: mirror_thumb_outward_home
          shift: [kpx, -kpy]
        - ref: mirror_thumb_outward_home
          shift: [-kpx, -kpy]
        - ref: mirror_thumb_middle_home
          shift: [kpx, -kpy]
        - ref: mirror_thumb_middle_home
          shift: [-kpx, -kpy]
        - ref: mirror_thumb_inward_home
          shift: [-kpx, -kpy]

        # Back to the main matrix
        - ref: mirror_matrix_outer_bottom
          shift: [-kpx, -kpy]

  left_mcu_cover_outline:
    - what: rectangle
      operation: add
      where: matrix_inner_number
      adjust:
        shift: [1 ks + 1, 0.5 kp]
      size: [1 ks + 2, 2]
    - what: rectangle
      where: matrix_inner_number
      adjust:
        shift: [1ks + 1, -0.5 kp]
      size: [1 ks + 2, 2 kp]
    - what: rectangle
      operation: add
      where: matrix_inner_home
      adjust:
        shift: [1ks + 1, -0.5 kp + 2]
      size: [1 ks + 2, 2 kp + 16]

  right_mcu_cover_outline:
    - what: rectangle
      where: mirror_matrix_inner_number
      adjust:
        shift: [1ks + 1, -0.5 kp]
      size: [1 ks + 2, 2 kp]
    - what: rectangle
      operation: add
      where: mirror_matrix_inner_home
      adjust:
        shift: [1ks + 1, -0.5 kp + 2]
      size: [1 ks + 2, 2 kp]
    - what: rectangle
      operation: add
      where: mirror_matrix_inner_number
      adjust:
        shift: [1 ks + 1, 0.5 kp]
      size: [1 ks + 2, 2]

  keys:
    - what: rectangle
      where: -key_1_5u
      size: [14, 14]
      fillet: 0

  all_keys:
    - what: rectangle
      where: true
      size: [14, 14]
      fillet: 0

  left_keys:
    - what: rectangle
      where: /^matrix_|^thumb_/
      size: [kcow, kcoh]
      fillet: 0

  right_keys:
    - what: rectangle
      where: /^mirror_/
      size: [kcow, kcoh]
      fillet: 0

  left_keys_1_5u:
    - what: rectangle
      where: thumb_outward_home
      size: [1.5 keycw, keych]
      fillet: 0
    - what: rectangle
      where: thumb_middle_home
      size: [keycw, keych]
      fillet: 0

  right_keys_1_5u:
    - what: rectangle
      where: mirror_thumb_outward_home
      size: [1.5 keycw, keych]
      fillet: 0
    - what: rectangle
      where: mirror_thumb_middle_home
      size: [keycw, keych]
      fillet: 0

  left_thumb_outline:
    - what: rectangle
      where: /^thumb/
      size: [ks + kpx, kp + kpy]

  right_thumb_outline:
    - what: outline
      name: right_keys_1_5u
      expand: 2
      joints: 0

  left_pcb_outline:
    - what: rectangle
      where: matrix_outer_number
      size: [pcbx, pcby]
      adjust.shift: [0.5pcbx-0.5mcux-(2.75/4)-1.5, -0.5pcby + kp]
      fillet: 2
    - what: polygon
      operation: subtract
      points:
        - ref: matrix_outer_bottom
          shift: [-0.5 kp - 5, -0.5 kp]
        - ref: ref_mcu
          shift: [-0.5 mcux - 5, -0.5 mcuy - 5]
        - ref: ref_mcu
          shift: [-0.5 mcux - 55, -0.5 mcuy]
    - what: outline
      name: left_thumb_outline
      fillet: 2
    # - what: outline
    #   name: left_matrix_outline
    #   expand: 1
    #   joints: 0
    # - what: outline
    #   name: left_mcu_cover_outline
    #   operation: add
    # # - what: outline
    # #   name: left_thumb_outline
    # #   operation: add

  right_pcb_outline:
    - what: outline
      name: right_matrix_outline
      expand: 1
      joints: 0
    - what: outline
      name: right_mcu_cover_outline
      operation: add
    # - what: outline
    #   name: right_thumb_outline
    #   operation: add

  left_plate_outline:
    - name: left_pcb_outline
      expand: plate_to_pcb_padding
      joints: 0
    - name: left_keys
      operation: subtract

  right_plate_outline:
    - name: right_pcb_outline
      expand: plate_to_pcb_padding
      joints: 0
    - name: right_keys
      operation: subtract

  screws:
    - what: circle
      where: /screw_pcb/
      radius: screw_radius

  # screw_heads:
  #   - what: circle
  #     where: /screw_pcb/
  #     radius: screw_head_radius

pcbs:
  souffle_left:
    template: kicad8
    outlines:
      main:
        outline: left_pcb_outline

    footprints:
      m2_spacers:
        what: mounting_hole_npth
        where: /^screw_pcb/
        params:
          hole_size: spacer_diameter
          hole_drill: spacer_diameter

      key_switches:
        what: *switch_footprint
        where: /^matrix_|^thumb_/
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          # include_keycap: true
          # include_corner_marks: true
          # include_stabilizer_pad: false
        adjust:
          rotate: switch_rotation

      diodes:
        what: diode_tht_sod123
        where: /^matrix_|^thumb_/
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          include_tht: false
          reversible: false
        adjust:
          shift: [-1 * horizontal_diode_shift, vertical_diode_shift]
          rotate: 90 + diode_rotation

      # LiPo battery
      lipo:
        what: lipo_reversible
        where:
          ref:
            ref: matrix_outer_number
            shift: [-7, 11]
        params:
          side: F

      # Battery jack
      jstph:
        what: jstph
        where:
          ref: ref_mcu
          shift: [0.5 mcux + 5, -3]
        params:
          side: F
          pos: pos
          neg: GND
        adjust:
          rotate: 90

      reset_switch:
        what: EVQPUC
        where: matrix_outer_home
        params:
          side: F
          from: GND
          to: RST
        adjust:
          shift: [-11.1, 3]
          rotate: 90

      # Battery on/off switch
      battery_switch:
        what: slider
        where:
          ref: matrix_outer_home
          shift: [-11.2, -11]
          rotate: 90
        params:
          side: F
          from: pos
          to: RAW

      # display:
      #   what: nice_view
      #   where:
      #     ref: ref_display
      #     rotate: -90

      mcu:
        what: xiao-ble
        # what: mcu_nice_nano
        where:
          ref: ref_mcu
          shift: [-2, 0]
          rotate: 180
        params:
          D0: R0
          D1: R1
          D2: R2
          D3: R3
          D4: R4
          D5: C0
          D6: C1
          D7: C2
          D8: C3
          D9: C4
          D10: C5
          side: F
          # P0: MOSI
          # P1: SCK
          # P2: CS
          # P5: R0
          # P6: R1
          # P7: R2
          # P8: R3
          # P9: R4
          # P21: C0
          # P20: C1
          # P19: C2
          # P18: C3
          # P15: C4
          # P14: C5
          # side: F
          # reversible: false
          # include_traces: true
          # show_silk_labels: true
          # show_via_labels: true
          # show_instructions: false
          # use_rectangular_jumpers: true

  souffle_right:
    template: kicad8
    outlines:
      main:
        outline: right_pcb_outline

    footprints:
      m2_spacers:
        what: mounting_hole_npth
        where: /^mirror_screw_pcb/
        params:
          hole_size: spacer_diameter
          hole_drill: spacer_diameter
        # params:
        #   hole_size: spacer_diameter
        #   hole_drill: spacer_diameter

      key_switches:
        what: *switch_footprint
        where: /^mirror_matrix_|^mirror_thumb_/
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          # include_keycap: true
          # include_corner_marks: true
          # include_stabilizer_pad: false
          # P1: "{{column_net}}"
          # P2: "{{colrow}}"
          # P3: ""
        adjust:
          rotate: switch_rotation

      diodes:
        what: diode_tht_sod123
        where: /^mirror_matrix_|^mirror_thumb_/
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          include_tht: false
          reversible: false
        adjust:
          shift: [-1 * horizontal_diode_shift, vertical_diode_shift]
          rotate: 90 + diode_rotation

      # Battery jack
      jstph:
        what: jstph
        where:
          ref: ref_mcu
          shift: [0.5 mcux + 5, 15]
        params:
          side: F
          pos: pos
          neg: GND

      reset_switch:
        what: EVQPUC
        where: mirror_matrix_outer_home
        params:
          side: B
          from: GND
          to: RST
        adjust:
          shift: [-9.1, 3]
          rotate: 90

      # Battery on/off switch
      battery_switch:
        what: slider
        where:
          ref: mirror_matrix_outer_home
          shift: [-9.1, -11]
          rotate: 90
        params:
          side: B
          from: pos
          to: RAW

      mcu:
        what: mcu_nice_nano
        where: mirror_matrix_inner_number
        adjust:
          shift: [1 ks + 1, -0.5 kp + 2]
        params:
          P0: DAT
          P1: LED
          P2: SDA
          P3: SCL
          P4: CS
          P5: R0
          P6: R1
          P7: R2
          P8: R3
          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: C5
          reversible: false
          include_traces: true
          show_silk_labels: true
          show_via_labels: true
          show_instructions: false
          use_rectangular_jumpers: true
